[project]
name = "painting-assist"
version = "0.6.1"
description = "Painting Assist, a coarse to fine painting reference tool"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    # PySide6 pinned to 6.8.1.1: 6.11.x fails to load its Qt platform plugins
    # under the bundled macOS interpreters.
    "pyside6==6.8.1.1",
    "numpy",
    "opencv-python",
    "Pillow",
    # Physically-plausible pigment mixing (Kubelka-Munk latent space). Note:
    # pymixbox is CC BY-NC 4.0 (non-commercial); see NOTICE. Bundling it makes
    # the built installers non-commercial while this project's own source stays
    # MIT.
    "pymixbox",
]

[project.scripts]
painting-assist = "painting_assist.app:main"

[dependency-groups]
dev = ["pytest", "pyinstaller", "pre-commit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["painting_assist"]
