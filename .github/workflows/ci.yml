name: CI

# Run the test suite and the pre-commit hooks on every push and pull request,
# so regressions and lint/format drift are caught before a release is cut.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # The tests import PySide6.QtGui; use the offscreen platform so no display
      # is needed on the runner.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # PySide6/QtGui needs these system libraries present even just to import
      # (libEGL and friends), so install them before running the suite.
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libglib2.0-0 \
            libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 \
            libxcb1 libxcb-cursor0 libxcb-glx0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render0 libxcb-render-util0 libxcb-shape0 \
            libxcb-shm0 libxcb-sync1 libxcb-util1 libxcb-xfixes0 \
            libxcb-xinerama0 libxcb-xkb1

      - name: Sync dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest -q

      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files --show-diff-on-failure
