# Copyright 2026 Vinay Williams

name: Build installers

# Build native installers for macOS (arm64 + x86_64), Windows and Linux.
# Runs on version tags (v*) to attach artifacts to a GitHub release, and on
# manual dispatch for testing the build legs without cutting a release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # needed to create/attach the release on tag builds

jobs:
  # ------------------------------------------------------------------ macOS
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14 # Apple silicon
            arch: arm64
          - runner: macos-15-intel # Intel (macos-13 image is retired)
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --dev

      - name: Build app bundle
        run: uv run pyinstaller packaging/painting_assist.spec --noconfirm

      - name: Package DMG
        run: |
          set -euxo pipefail
          APP="dist/Painting Assist.app"
          # Strip extended-attribute detritus so ad-hoc signing succeeds.
          xattr -cr "$APP"
          codesign -s - --force --deep "$APP" || true
          STAGE="$(mktemp -d)"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          DMG="dist/PaintingAssist-0.6.1-macos-${{ matrix.arch }}.dmg"
          # hdiutil sporadically fails with "Resource busy" on GitHub runners;
          # retry a few times before giving up.
          for attempt in 1 2 3; do
            if hdiutil create -volname "Painting Assist" -srcfolder "$STAGE" \
              -ov -format UDZO "$DMG"; then
              break
            fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 5
          done
          rm -rf "$STAGE"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-dmg
          path: dist/PaintingAssist-0.6.1-macos-${{ matrix.arch }}.dmg

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PaintingAssist-0.6.1-macos-${{ matrix.arch }}.dmg

  # ---------------------------------------------------------------- Windows
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --dev

      - name: Build app bundle
        run: uv run pyinstaller packaging/painting_assist.spec --noconfirm

      # iscc (Inno Setup) is preinstalled on GitHub windows-latest runners.
      - name: Build installer
        shell: pwsh
        run: iscc packaging\windows_installer.iss

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-setup
          path: dist/PaintingAssist-0.6.1-windows-x64-setup.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PaintingAssist-0.6.1-windows-x64-setup.exe

  # ------------------------------------------------------------------ Linux
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # Qt xcb platform plugin runtime dependencies.
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libglib2.0-0 \
            libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 \
            libxcb1 libxcb-cursor0 libxcb-glx0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render0 libxcb-render-util0 libxcb-shape0 \
            libxcb-shm0 libxcb-sync1 libxcb-util1 libxcb-xfixes0 \
            libxcb-xinerama0 libxcb-xkb1

      - name: Sync dependencies
        run: uv sync --dev

      - name: Build app bundle
        run: uv run pyinstaller packaging/painting_assist.spec --noconfirm

      - name: Package tar.gz (fallback)
        run: |
          set -euxo pipefail
          tar -czf "dist/PaintingAssist-0.6.1-linux-x86_64.tar.gz" \
            -C dist "Painting Assist"

      - name: Build AppImage
        run: |
          set -euxo pipefail
          APPDIR="AppDir"
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/applications" \
            "$APPDIR/usr/share/icons/hicolor/256x256/apps"

          # Copy the onedir payload into the AppDir.
          cp -R "dist/Painting Assist/." "$APPDIR/usr/bin/"

          # Icon (top level + hicolor path; both referenced by name "painting-assist").
          cp painting_assist/resources/icon.png \
            "$APPDIR/usr/share/icons/hicolor/256x256/apps/painting-assist.png"
          cp painting_assist/resources/icon.png "$APPDIR/painting-assist.png"

          # Desktop entry.
          cat > "$APPDIR/usr/share/applications/painting-assist.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Painting Assist
          Exec=PaintingAssist
          Icon=painting-assist
          Categories=Graphics;
          Terminal=false
          EOF
          cp "$APPDIR/usr/share/applications/painting-assist.desktop" \
            "$APPDIR/painting-assist.desktop"

          # AppRun launcher: set LD_LIBRARY_PATH so bundled Qt libs resolve.
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="$HERE/usr/bin:${LD_LIBRARY_PATH}"
          exec "$HERE/usr/bin/PaintingAssist" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

          # Fetch appimagetool and assemble the AppImage.
          wget -q -O appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          # extract-and-run avoids needing FUSE on the runner.
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run \
            "$APPDIR" "dist/PaintingAssist-0.6.1-linux-x86_64.AppImage"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-appimage
          path: dist/PaintingAssist-0.6.1-linux-x86_64.AppImage

      - name: Upload tar.gz artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-tarball
          path: dist/PaintingAssist-0.6.1-linux-x86_64.tar.gz

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PaintingAssist-0.6.1-linux-x86_64.AppImage
            dist/PaintingAssist-0.6.1-linux-x86_64.tar.gz
